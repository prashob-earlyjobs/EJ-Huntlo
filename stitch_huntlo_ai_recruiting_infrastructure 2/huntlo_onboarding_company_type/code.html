<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Huntlo Source - Company Type</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-container": "#f8f7ff",
                        "on-secondary-fixed": "#0b1c30",
                        "on-secondary-fixed-variant": "#38485d",
                        "tertiary": "#555a5d",

                        "on-surface-variant": "#424656",
                        "secondary-fixed-dim": "#b7c8e1",
                        "surface-container-lowest": "#ffffff",
                        "secondary-container": "#d0e1fb",
                        "primary": "#0050cb",
                        "on-primary-fixed": "#001849",
                        "inverse-on-surface": "#edf0ff",
                        "surface-tint": "#0054d6",
                        "secondary-fixed": "#d3e4fe",
                        "inverse-primary": "#b3c5ff",
                        "on-tertiary-fixed": "#171c1f",
                        "outline": "#727687",
                        "on-primary-fixed-variant": "#003fa4",
                        "tertiary-fixed-dim": "#c3c7cb",
                        "on-tertiary-container": "#f4f8fc",
                        "on-surface": "#141b2b",
                        "inverse-surface": "#293040",
                        "error-container": "#ffdad6",
                        "primary-container": "#0066ff",
                        "primary-fixed-dim": "#b3c5ff",
                        "on-secondary": "#ffffff",
                        "secondary": "#505f76",
                        "outline-variant": "#c2c6d8",
                        "tertiary-fixed": "#dfe3e7",
                        "on-background": "#141b2b",
                        "error": "#ba1a1a",
                        "surface-bright": "#f9f9ff",
                        "surface-variant": "#dce2f7",
                        "surface-container-highest": "#dce2f7",
                        "tertiary-container": "#6d7276",
                        "surface-container-high": "#e1e8fd",
                        "on-tertiary-fixed-variant": "#43474b",
                        "surface-container": "#e9edff",
                        "primary-fixed": "#dae1ff",

                        "on-secondary-container": "#54647a",

                        "surface-container-low": "#f1f3ff",
                        "surface": "#f9f9ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",

                    "spacing": {

                        "margin-mobile": "16px",
                        "gutter": "24px",
                        "stack-md": "16px",

                        "unit": "4px",
                        "stack-lg": "32px",
                        "margin-desktop": "64px"
                    },
                    "fontFamily": {
                        "headline-md": ["Syne"],
                        "label-sm": ["Inter"],
                        "body-md": ["Inter"],
                        "display-lg": ["Syne"],
                        "headline-lg-mobile": ["Syne"],
                        "label-md": ["Inter"],

                        "body-lg": ["Inter"]

                    "fontSize": {
                        "headline-md": ["20px", { "lineHeight": "1.3", "letterSpacing": "0.01em", "fontWeight": "600" }],

<style>
        .glow-shadow {
            box-shadow: 0 4px 20px rgba(80, 95, 118, 0.1);
        }
        .glow-shadow-hover:hover {
            box-shadow: 0 8px 30px rgba(0, 80, 203, 0.15);
            border-color: #0050cb;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md text-body-md antialiased">
<!-- Header (Suppressed top navigation links as this is a linear onboarding flow, keeping only brand and minimal actions) -->
<header class="bg-surface/70 dark:bg-surface-dim/70 backdrop-blur-xl border-b border-outline-variant/30 docked full-width top-0 sticky z-50 flex justify-between items-center w-full px-margin-mobile md:px-margin-desktop h-16">
<div class="font-headline-md text-headline-md font-bold text-on-surface dark:text-inverse-on-surface">
            Huntlo Source
        </div>
<div class="flex gap-4">
<button class="text-on-surface-variant hover:text-primary transition-colors duration-200 active:scale-95 duration-150">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">help</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile md:px-margin-tablet py-stack-lg w-full max-w-4xl mx-auto">
<!-- Progress Indicator -->
<div class="w-full mb-stack-lg flex flex-col items-center">
<div class="font-label-sm text-label-sm text-on-surface-variant mb-stack-sm uppercase tracking-wider">Step 2 of 7</div>
<div class="w-full max-w-md h-2 bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full transition-all duration-500" style="width: 28.5%;"></div>
</div>
</div>
<!-- Question Title -->
<div class="text-center mb-stack-lg">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mb-stack-sm">Who do you hire for?</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Select the option that best describes your organization type.</p>
</div>
<!-- Selection Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-stack-md w-full max-w-3xl">
<!-- Option: Recruitment Agency -->
<label class="relative cursor-pointer group">
<input class="peer sr-only" name="company_type" type="radio" value="recruitment_agency"/>
<div class="h-full bg-surface-container-lowest border border-outline-variant/50 rounded-xl p-stack-md flex items-center gap-stack-md glow-shadow glow-shadow-hover transition-all duration-300 peer-checked:border-primary peer-checked:bg-surface-container peer-checked:shadow-[0_0_0_1px_rgba(0,80,203,1)]">
<div class="w-12 h-12 rounded-lg bg-surface-container-high text-primary flex items-center justify-center shrink-0 group-hover:bg-primary group-hover:text-on-primary transition-colors duration-300 peer-checked:bg-primary peer-checked:text-on-primary">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 0;">groups</span>
</div>
<div>
<h3 class="font-headline-md text-headline-md text-on-surface">Recruitment Agency</h3>
</div>
</div>
</label>
<!-- Option: Startup -->
<label class="relative cursor-pointer group">
<input class="peer sr-only" name="company_type" type="radio" value="startup"/>
<div class="h-full bg-surface-container-lowest border border-outline-variant/50 rounded-xl p-stack-md flex items-center gap-stack-md glow-shadow glow-shadow-hover transition-all duration-300 peer-checked:border-primary peer-checked:bg-surface-container peer-checked:shadow-[0_0_0_1px_rgba(0,80,203,1)]">
<div class="w-12 h-12 rounded-lg bg-surface-container-high text-primary flex items-center justify-center shrink-0 group-hover:bg-primary group-hover:text-on-primary transition-colors duration-300 peer-checked:bg-primary peer-checked:text-on-primary">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 0;">rocket_launch</span>
</div>
<div>
<h3 class="font-headline-md text-headline-md text-on-surface">Startup</h3>
</div>
</div>
</label>
<!-- Option: Enterprise / GCC -->
<label class="relative cursor-pointer group">
<input class="peer sr-only" name="company_type" type="radio" value="enterprise_gcc"/>
<div class="h-full bg-surface-container-lowest border border-outline-variant/50 rounded-xl p-stack-md flex items-center gap-stack-md glow-shadow glow-shadow-hover transition-all duration-300 peer-checked:border-primary peer-checked:bg-surface-container peer-checked:shadow-[0_0_0_1px_rgba(0,80,203,1)]">
<div class="w-12 h-12 rounded-lg bg-surface-container-high text-primary flex items-center justify-center shrink-0 group-hover:bg-primary group-hover:text-on-primary transition-colors duration-300 peer-checked:bg-primary peer-checked:text-on-primary">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 0;">domain</span>
</div>
<div>
<h3 class="font-headline-md text-headline-md text-on-surface">Enterprise / GCC</h3>
</div>
</div>
</label>
<!-- Option: Staffing Firm -->
<label class="relative cursor-pointer group">
<input class="peer sr-only" name="company_type" type="radio" value="staffing_firm"/>
<div class="h-full bg-surface-container-lowest border border-outline-variant/50 rounded-xl p-stack-md flex items-center gap-stack-md glow-shadow glow-shadow-hover transition-all duration-300 peer-checked:border-primary peer-checked:bg-surface-container peer-checked:shadow-[0_0_0_1px_rgba(0,80,203,1)]">
<div class="w-12 h-12 rounded-lg bg-surface-container-high text-primary flex items-center justify-center shrink-0 group-hover:bg-primary group-hover:text-on-primary transition-colors duration-300 peer-checked:bg-primary peer-checked:text-on-primary">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 0;">engineering</span>
</div>
<div>
<h3 class="font-headline-md text-headline-md text-on-surface">Staffing Firm</h3>
</div>
</div>
</label>
<!-- Option: Executive Search -->
<label class="relative cursor-pointer group md:col-span-2 md:max-w-[calc(50%-8px)] md:mx-auto">
<input class="peer sr-only" name="company_type" type="radio" value="executive_search"/>
<div class="h-full bg-surface-container-lowest border border-outline-variant/50 rounded-xl p-stack-md flex items-center gap-stack-md glow-shadow glow-shadow-hover transition-all duration-300 peer-checked:border-primary peer-checked:bg-surface-container peer-checked:shadow-[0_0_0_1px_rgba(0,80,203,1)] w-full">
<div class="w-12 h-12 rounded-lg bg-surface-container-high text-primary flex items-center justify-center shrink-0 group-hover:bg-primary group-hover:text-on-primary transition-colors duration-300 peer-checked:bg-primary peer-checked:text-on-primary">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 0;">manage_accounts</span>
</div>
<div>
<h3 class="font-headline-md text-headline-md text-on-surface">Executive Search</h3>
</div>
</div>
</label>
</div>
<!-- Navigation Actions -->
<div class="mt-stack-lg flex justify-between w-full max-w-3xl">
<button class="px-6 py-3 rounded-lg border border-outline-variant/50 bg-surface-container-lowest text-on-surface hover:bg-surface-container transition-colors duration-200 font-label-md text-label-md flex items-center gap-2">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
                Back
            </button>
<button class="px-8 py-3 rounded-lg bg-primary text-on-primary hover:bg-on-primary-fixed-variant transition-colors duration-200 font-label-md text-label-md flex items-center gap-2 shadow-[0_4px_14px_rgba(0,80,203,0.3)]">
                Continue
                <span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
</div>
</main>
<!-- Footer -->
<footer class="bg-surface dark:bg-surface-dim border-t border-outline-variant/20 full-width py-stack-lg mt-auto">
<div class="flex flex-col md:flex-row justify-between items-center px-margin-mobile md:px-margin-desktop w-full max-w-7xl mx-auto gap-stack-sm md:gap-0">
<div class="font-label-sm text-label-sm text-on-surface-variant dark:text-on-tertiary-fixed-variant">
                © 2024 Huntlo Source. AI-Driven Recruiting Infrastructure.
            </div>
<div class="flex gap-gutter font-label-sm text-label-sm">
<a class="text-on-surface-variant dark:text-on-tertiary-fixed-variant hover:text-primary transition-opacity duration-300" href="#">Privacy Policy</a>
<a class="text-on-surface-variant dark:text-on-tertiary-fixed-variant hover:text-primary transition-opacity duration-300" href="#">Terms of Service</a>
<a class="text-on-surface-variant dark:text-on-tertiary-fixed-variant hover:text-primary transition-opacity duration-300" href="#">Help Center</a>
</div>
</div>
</footer>
</body></html>

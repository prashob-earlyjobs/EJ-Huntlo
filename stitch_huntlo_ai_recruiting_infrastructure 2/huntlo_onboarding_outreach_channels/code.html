<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Huntlo Source - Outreach Channels</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Syne:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill-icon {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                            "on-primary-container": "#f8f7ff",
                            "on-secondary-fixed": "#0b1c30",
                            "on-secondary-fixed-variant": "#38485d",
                            "tertiary": "#555a5d",
                            "on-tertiary": "#ffffff",
                            "on-surface-variant": "#424656",
                            "secondary-fixed-dim": "#b7c8e1",
                            "surface-container-lowest": "#ffffff",
                            "secondary-container": "#d0e1fb",
                            "primary": "#0050cb",
                            "on-primary-fixed": "#001849",
                            "inverse-on-surface": "#edf0ff",
                            "surface-tint": "#0054d6",
                            "secondary-fixed": "#d3e4fe",
                            "inverse-primary": "#b3c5ff",
                            "on-tertiary-fixed": "#171c1f",
                            "outline": "#727687",
                            "on-primary-fixed-variant": "#003fa4",
                            "tertiary-fixed-dim": "#c3c7cb",
                            "on-tertiary-container": "#f4f8fc",
                            "on-surface": "#141b2b",
                            "inverse-surface": "#293040",
                            "error-container": "#ffdad6",
                            "primary-container": "#0066ff",
                            "primary-fixed-dim": "#b3c5ff",
                            "on-secondary": "#ffffff",
                            "secondary": "#505f76",
                            "outline-variant": "#c2c6d8",
                            "tertiary-fixed": "#dfe3e7",
                            "on-background": "#141b2b",
                            "error": "#ba1a1a",
                            "surface-bright": "#f9f9ff",
                            "surface-variant": "#dce2f7",
                            "surface-container-highest": "#dce2f7",
                            "tertiary-container": "#6d7276",
                            "surface-container-high": "#e1e8fd",
                            "on-tertiary-fixed-variant": "#43474b",
                            "surface-container": "#e9edff",
                            "primary-fixed": "#dae1ff",
                            "on-error-container": "#93000a",
                            "on-secondary-container": "#54647a",
                            "surface-dim": "#d3daef",
                            "on-primary": "#ffffff",
                            "background": "#f9f9ff",
                            "on-error": "#ffffff",
                            "surface-container-low": "#f1f3ff",
                            "surface": "#f9f9ff"
                    },
                    "borderRadius": {
                            "DEFAULT": "0.25rem",
                            "lg": "0.5rem",
                            "xl": "0.75rem",
                            "full": "9999px"
                    },
                    "spacing": {
                            "margin-tablet": "32px",
                            "margin-mobile": "16px",
                            "gutter": "24px",
                            "stack-md": "16px",
                            "stack-sm": "8px",
                            "unit": "4px",
                            "stack-lg": "32px",
                            "margin-desktop": "64px"
                    },
                    "fontFamily": {
                            "headline-md": ["Syne"],
                            "label-sm": ["Inter"],
                            "body-md": ["Inter"],
                            "display-lg": ["Syne"],
                            "headline-lg-mobile": ["Syne"],
                            "label-md": ["Inter"],
                            "headline-lg": ["Syne"],
                            "body-lg": ["Inter"]
                    },
                    "fontSize": {
                            "headline-md": ["20px", {"lineHeight": "1.3", "letterSpacing": "0.01em", "fontWeight": "600"}],
                            "label-sm": ["12px", {"lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600"}],
                            "body-md": ["16px", {"lineHeight": "1.5", "letterSpacing": "0", "fontWeight": "400"}],
                            "display-lg": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                            "headline-lg-mobile": ["24px", {"lineHeight": "1.2", "letterSpacing": "0", "fontWeight": "600"}],
                            "label-md": ["14px", {"lineHeight": "1", "letterSpacing": "0.02em", "fontWeight": "500"}],
                            "headline-lg": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                            "body-lg": ["18px", {"lineHeight": "1.6", "letterSpacing": "0", "fontWeight": "400"}]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md text-body-md antialiased selection:bg-primary/20">
<!-- Header: Hidden for linear flow as per instructions, replaced with a minimal progress header -->
<header class="w-full px-margin-mobile md:px-margin-desktop py-stack-lg flex justify-between items-center z-50">
<div class="font-headline-md text-headline-md font-bold text-on-surface">Huntlo Source</div>
<div class="flex items-center gap-unit">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest">Step 4 of 7</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile md:px-margin-desktop py-stack-lg max-w-4xl mx-auto w-full">
<!-- Progress Bar -->
<div class="w-full max-w-md mb-stack-lg">
<div class="h-1 w-full bg-surface-variant rounded-full overflow-hidden">
<div class="h-full bg-primary transition-all duration-500 ease-out" style="width: 57%;"></div>
</div>
</div>
<!-- Question Header -->
<div class="text-center mb-stack-lg max-w-2xl">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-stack-sm">Where do candidates respond most?</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Select the primary channels you use to communicate with talent. We'll tailor your dashboard to these workflows.</p>
</div>
<!-- Segmented Multi-Select Cards -->
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-stack-md w-full mb-stack-lg">
<!-- Option: WhatsApp (Selected State) -->
<button class="relative w-full text-left bg-surface border-2 border-primary rounded-xl p-stack-md flex flex-col gap-stack-md hover:bg-surface-container-low transition-colors duration-200 group focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
<div class="absolute top-4 right-4 text-primary">
<span class="material-symbols-outlined fill-icon text-[24px]">check_circle</span>
</div>
<div class="flex items-center justify-center w-12 h-12 rounded-full bg-primary-container text-on-primary-container mb-unit">
<span class="material-symbols-outlined text-[24px]">chat</span>
</div>
<div>
<h3 class="font-headline-md text-headline-md text-on-surface mb-unit">WhatsApp</h3>
<p class="font-body-md text-body-md text-on-surface-variant text-sm">Direct, informal messaging.</p>
</div>
<!-- Intelligent Badge (Simulated active) -->
<div class="mt-auto pt-stack-sm border-t border-primary/20">
<div class="flex items-start gap-2 text-primary">
<span class="material-symbols-outlined text-[16px] mt-0.5">lightbulb</span>
<span class="font-label-sm text-label-sm leading-tight">Most recruiters in India prefer WhatsApp workflows.</span>
</div>
</div>
</button>
<!-- Option: Email (Unselected State) -->
<button class="w-full text-left bg-surface border border-outline-variant rounded-xl p-stack-md flex flex-col gap-stack-md hover:border-primary hover:bg-surface-container-low transition-all duration-200 group focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
<div class="flex items-center justify-center w-12 h-12 rounded-full bg-surface-variant text-on-surface-variant group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors duration-200 mb-unit">
<span class="material-symbols-outlined text-[24px]">mail</span>
</div>
<div>
<h3 class="font-headline-md text-headline-md text-on-surface mb-unit">Email</h3>
<p class="font-body-md text-body-md text-on-surface-variant text-sm">Formal, structured communication.</p>
</div>
</button>
<!-- Option: LinkedIn (Unselected State) -->
<button class="w-full text-left bg-surface border border-outline-variant rounded-xl p-stack-md flex flex-col gap-stack-md hover:border-primary hover:bg-surface-container-low transition-all duration-200 group focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
<div class="flex items-center justify-center w-12 h-12 rounded-full bg-surface-variant text-on-surface-variant group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors duration-200 mb-unit">
<span class="material-symbols-outlined text-[24px]">work</span>
</div>
<div>
<h3 class="font-headline-md text-headline-md text-on-surface mb-unit">LinkedIn</h3>
<p class="font-body-md text-body-md text-on-surface-variant text-sm">Professional networking &amp; InMail.</p>
</div>
</button>
<!-- Option: Calls (Selected State) -->
<button class="relative w-full text-left bg-surface border-2 border-primary rounded-xl p-stack-md flex flex-col gap-stack-md hover:bg-surface-container-low transition-colors duration-200 group focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
<div class="absolute top-4 right-4 text-primary">
<span class="material-symbols-outlined fill-icon text-[24px]">check_circle</span>
</div>
<div class="flex items-center justify-center w-12 h-12 rounded-full bg-primary-container text-on-primary-container mb-unit">
<span class="material-symbols-outlined text-[24px]">call</span>
</div>
<div>
<h3 class="font-headline-md text-headline-md text-on-surface mb-unit">Calls</h3>
<p class="font-body-md text-body-md text-on-surface-variant text-sm">Direct voice conversations.</p>
</div>
</button>
<!-- Option: SMS (Unselected State) -->
<button class="w-full text-left bg-surface border border-outline-variant rounded-xl p-stack-md flex flex-col gap-stack-md hover:border-primary hover:bg-surface-container-low transition-all duration-200 group focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
<div class="flex items-center justify-center w-12 h-12 rounded-full bg-surface-variant text-on-surface-variant group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors duration-200 mb-unit">
<span class="material-symbols-outlined text-[24px]">sms</span>
</div>
<div>
<h3 class="font-headline-md text-headline-md text-on-surface mb-unit">SMS</h3>
<p class="font-body-md text-body-md text-on-surface-variant text-sm">Standard text messaging.</p>
</div>
</button>
</div>
<!-- Action Area -->
<div class="flex items-center justify-between w-full max-w-md mt-stack-md">
<button class="px-6 py-3 font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-colors duration-200 focus:outline-none">
                Back
            </button>
<button class="px-8 py-3 bg-primary text-on-primary font-label-md text-label-md rounded-lg hover:bg-primary/90 transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 shadow-sm shadow-primary/10">
                Continue
            </button>
</div>
</main>
</body></html>

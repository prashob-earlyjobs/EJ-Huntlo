<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased selection:bg-primary selection:text-on-primary">
<!-- TopAppBar suppressed as this is a transactional onboarding screen -->
<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-margin-tablet lg:p-margin-desktop relative overflow-hidden">
<!-- Abstract background elements -->
<div class="absolute top-[-10%] left-[-10%] w-[50vw] h-[50vw] rounded-full bg-primary-fixed/30 blur-[100px] -z-10 pointer-events-none"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40vw] h-[40vw] rounded-full bg-secondary-fixed/30 blur-[80px] -z-10 pointer-events-none"></div>
<div class="w-full max-w-3xl glass-panel rounded-xl border border-outline-variant/30 p-stack-lg shadow-[0_8px_32px_rgba(66,70,86,0.05)]">
<!-- Progress Indicator -->
<div class="mb-stack-lg flex flex-col items-center">
<div class="w-full bg-surface-variant h-2 rounded-full overflow-hidden mb-stack-sm relative">
<div class="absolute top-0 left-0 h-full bg-primary rounded-full w-[42.8%] transition-all duration-500 ease-in-out"></div>
</div>
<div class="flex justify-between w-full text-on-surface-variant font-label-sm text-label-sm">
<span>Step 3 of 7</span>
<span>Hiring Challenges</span>
</div>
</div>
<!-- Header -->
<div class="text-center mb-stack-lg">
<h1 class="font-display-lg text-display-lg text-on-surface mb-stack-sm md:hidden hidden">What slows down your hiring most?</h1>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mb-stack-sm">What slows down your hiring most?</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Select all that apply to help us tailor your experience.</p>
</div>
<!-- Bento Grid / Interactive Cards -->
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-gutter mb-stack-lg">
<!-- Card 1 -->
<button class="flex flex-col items-start p-stack-md bg-surface border border-outline-variant rounded-lg hover:border-primary focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 transition-all duration-200 group text-left relative overflow-hidden">
<div class="absolute top-0 right-0 p-3 opacity-0 group-hover:opacity-100 transition-opacity">
<div class="w-5 h-5 rounded-full border border-primary flex items-center justify-center">
<!-- Check icon placeholder -->
</div>
</div>
<span class="material-symbols-outlined text-primary mb-stack-sm" data-icon="search" data-weight="fill">search</span>
<h3 class="font-label-md text-label-md text-on-surface mb-unit group-hover:text-primary transition-colors">Finding qualified candidates</h3>
<p class="font-label-sm text-label-sm text-on-surface-variant">Sourcing the right talent takes too much time.</p>
</button>
<!-- Card 2 -->
<button class="flex flex-col items-start p-stack-md bg-surface border border-outline-variant rounded-lg hover:border-primary focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 transition-all duration-200 group text-left relative overflow-hidden">
<span class="material-symbols-outlined text-secondary mb-stack-sm" data-icon="mail_lock">mail_lock</span>
<h3 class="font-label-md text-label-md text-on-surface mb-unit group-hover:text-primary transition-colors">Low response rates</h3>
<p class="font-label-sm text-label-sm text-on-surface-variant">Candidates are not replying to initial outreach.</p>
</button>
<!-- Card 3 -->
<button class="flex flex-col items-start p-stack-md bg-surface border border-outline-variant rounded-lg hover:border-primary focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 transition-all duration-200 group text-left relative overflow-hidden">
<span class="material-symbols-outlined text-tertiary mb-stack-sm" data-icon="send_and_archive">send_and_archive</span>
<h3 class="font-label-md text-label-md text-on-surface mb-unit group-hover:text-primary transition-colors">Manual outreach</h3>
<p class="font-label-sm text-label-sm text-on-surface-variant">Spending hours drafting and sending messages.</p>
</button>
<!-- Card 4 (Selected state example) -->
<button class="flex flex-col items-start p-stack-md bg-surface-container-low border-2 border-primary rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 transition-all duration-200 text-left relative overflow-hidden shadow-[0_0_15px_rgba(0,80,203,0.1)]">
<div class="absolute top-0 right-0 p-3">
<div class="w-5 h-5 rounded-full bg-primary flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary text-[14px]" data-icon="check">check</span>
</div>
</div>
<span class="material-symbols-outlined text-primary mb-stack-sm" data-icon="fact_check" data-weight="fill">fact_check</span>
<h3 class="font-label-md text-label-md text-primary font-bold mb-unit">Screening candidates</h3>
<p class="font-label-sm text-label-sm text-on-surface-variant">Reviewing resumes and initial qualifications is slow.</p>
</button>
<!-- Card 5 -->
<button class="flex flex-col items-start p-stack-md bg-surface border border-outline-variant rounded-lg hover:border-primary focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 transition-all duration-200 group text-left relative overflow-hidden">
<span class="material-symbols-outlined text-secondary mb-stack-sm" data-icon="sync">sync</span>
<h3 class="font-label-md text-label-md text-on-surface mb-unit group-hover:text-primary transition-colors">Follow-ups &amp; coordination</h3>
<p class="font-label-sm text-label-sm text-on-surface-variant">Tracking conversations and scheduling interviews.</p>
</button>
<!-- Card 6 -->
<button class="flex flex-col items-start p-stack-md bg-surface border border-outline-variant rounded-lg hover:border-primary focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 transition-all duration-200 group text-left relative overflow-hidden">
<span class="material-symbols-outlined text-tertiary mb-stack-sm" data-icon="groups">groups</span>
<h3 class="font-label-md text-label-md text-on-surface mb-unit group-hover:text-primary transition-colors">Managing high hiring volume</h3>
<p class="font-label-sm text-label-sm text-on-surface-variant">Overwhelmed by the sheer number of open roles.</p>
</button>
</div>
<!-- Actions -->
<div class="flex justify-between items-center mt-stack-lg pt-stack-md border-t border-outline-variant/20">
<button class="px-6 py-3 font-label-md text-label-md text-on-surface-variant hover:text-on-surface bg-surface border border-outline-variant rounded hover:bg-surface-variant transition-colors focus:outline-none focus:ring-2 focus:ring-primary">
                    Back
                </button>
<button class="px-8 py-3 font-label-md text-label-md text-on-primary bg-primary rounded hover:bg-primary-fixed-variant hover:text-white transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 flex items-center gap-2">
                    Continue
                    <span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</div>

<!-- Footer suppressed on onboarding screens to prioritize flow -->
